# ── Netlify configuration for Taru frontend ──────────────────────
# Vite app lives in /frontend; output goes to /frontend/dist.

[build]
  base           = "frontend"          # Netlify runs all commands from here
  command        = "npm run build"
  publish        = "dist"              # relative to base, so resolves to frontend/dist
  edge_functions = "netlify/edge-functions"  # relative to base, so resolves to frontend/netlify/edge-functions
  timeout        = 300

[build.environment]
  NODE_VERSION     = "22"                                    # @sparticuz/chromium requires Node ^22.17.0 || >=24; Vite 8 requires Node ≥ 18
  VITE_BACKEND_URL = "https://taru-mvp-dr4o.onrender.com"   # Render backend URL baked at build time
  NPM_FLAGS        = "--include=dev"
  # Prerendering launches @sparticuz/chromium's bundled binary (see prerender-run.mjs),
  # not puppeteer's own Chrome — skip puppeteer's install-time download entirely so it
  # can't be the thing that silently fails in this build image.
  PUPPETEER_SKIP_DOWNLOAD = "true"

# ── taru.money -> nuberry.in (marketing pages only) ──────────────
# The marketing site moved to nuberry.in (repo Taru-Money/nuberry-web).
# Each old page 301s to the same page there, with the trailing slash
# nuberry.in uses, so there is one hop and search rankings carry over.
# App routes (/login, /signup, /verify-email, /forgot-password,
# /reset-password, /parent/*, /child/*, /app/*) are deliberately NOT
# redirected: the pilot app still lives here. Keep these above the SPA
# catch-all below.
[[redirects]]
  from = "/"
  to = "https://nuberry.in/"
  status = 301
  force = true
[[redirects]]
  from = "/about"
  to = "https://nuberry.in/about/"
  status = 301
  force = true
[[redirects]]
  from = "/about/"
  to = "https://nuberry.in/about/"
  status = 301
  force = true
[[redirects]]
  from = "/calculator"
  to = "https://nuberry.in/calculator/"
  status = 301
  force = true
[[redirects]]
  from = "/calculator/"
  to = "https://nuberry.in/calculator/"
  status = 301
  force = true
[[redirects]]
  from = "/tax-calculator"
  to = "https://nuberry.in/tax-calculator/"
  status = 301
  force = true
[[redirects]]
  from = "/tax-calculator/"
  to = "https://nuberry.in/tax-calculator/"
  status = 301
  force = true
[[redirects]]
  from = "/blog"
  to = "https://nuberry.in/blog/"
  status = 301
  force = true
[[redirects]]
  from = "/blog/"
  to = "https://nuberry.in/blog/"
  status = 301
  force = true
[[redirects]]
  from = "/privacy"
  to = "https://nuberry.in/privacy/"
  status = 301
  force = true
[[redirects]]
  from = "/privacy/"
  to = "https://nuberry.in/privacy/"
  status = 301
  force = true
[[redirects]]
  from = "/terms"
  to = "https://nuberry.in/terms/"
  status = 301
