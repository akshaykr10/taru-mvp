# ── Netlify configuration for Taru frontend ──────────────────────
# Vite app lives in /frontend; output goes to /frontend/dist.

[build]
  base           = "frontend"          # Netlify runs all commands from here
  command        = "npm run build"
  publish        = "dist"              # relative to base, so resolves to frontend/dist
  edge_functions = "netlify/edge-functions"  # relative to base, so resolves to frontend/netlify/edge-functions
  timeout        = 300

[build.environment]
  NODE_VERSION     = "22"                                    # @sparticuz/chromium requires Node ^22.17.0 || >=24; Vite 8 requires Node ≥ 18
  VITE_BACKEND_URL = "https://taru-mvp-dr4o.onrender.com"   # Render backend URL baked at build time
  NPM_FLAGS        = "--include=dev"
  # Prerendering launches @sparticuz/chromium's bundled binary (see prerender-run.mjs),
  # not puppeteer's own Chrome — skip puppeteer's install-time download entirely so it
  # can't be the thing that silently fails in this build image.
  PUPPETEER_SKIP_DOWNLOAD = "true"

# ── taru.money -> nuberry.in (marketing pages only) ──────────────
# The marketing site moved to nuberry.in (repo Taru-Money/nuberry-web).
# Each old page 301s to the same page there, with the trailing slash
# nuberry.in uses, so there is one hop and search rankings carry over.
# Keep these above the catch-all at the bottom, which sends every other
# path (including the retired app routes) to the nuberry.in homepage.
[[redirects]]
  from = "/"
  to = "https://nuberry.in/"
  status = 301
  force = true
[[redirects]]
  from = "/about"
  to = "https://nuberry.in/about/"
  status = 301
  force = true
[[redirects]]
  from = "/about/"
  to = "https://nuberry.in/about/"
  status = 301
  force = true
[[redirects]]
  from = "/calculator"
  to = "https://nuberry.in/calculator/"
  status = 301
  force = true
[[redirects]]
  from = "/calculator/"
  to = "https://nuberry.in/calculator/"
  status = 301
  force = true
[[redirects]]
  from = "/tax-calculator"
  to = "https://nuberry.in/tax-calculator/"
  status = 301
  force = true
[[redirects]]
  from = "/tax-calculator/"
  to = "https://nuberry.in/tax-calculator/"
  status = 301
  force = true
[[redirects]]
  from = "/blog"
  to = "https://nuberry.in/blog/"
  status = 301
  force = true
[[redirects]]
  from = "/blog/"
  to = "https://nuberry.in/blog/"
  status = 301
  force = true
[[redirects]]
  from = "/privacy"
  to = "https://nuberry.in/privacy/"
  status = 301
  force = true
[[redirects]]
  from = "/privacy/"
  to = "https://nuberry.in/privacy/"
  status = 301
  force = true
[[redirects]]
  from = "/terms"
  to = "https://nuberry.in/terms/"
  status = 301
  force = true
[[redirects]]
  from = "/terms/"
  to = "https://nuberry.in/terms/"
  status = 301
  force = true
[[redirects]]
  from = "/eula"
  to = "https://nuberry.in/eula/"
  status = 301
  force = true
[[redirects]]
  from = "/eula/"
  to = "https://nuberry.in/eula/"
  status = 301
  force = true
[[redirects]]
  from = "/blog/:slug"
  to = "https://nuberry.in/blog/:slug/"
  status = 301
  force = true
[[redirects]]
  from = "/blog/:slug/"
  to = "https://nuberry.in/blog/:slug/"
  status = 301
  force = true

# /learn was in the old sitemap but is no longer a route. Send it to the
# blog on nuberry.in, which replaced it.
[[redirects]]
  from = "/learn"
  to = "https://nuberry.in/blog/"
  status = 301
  force = true
[[redirects]]
  from = "/learn/*"
  to = "https://nuberry.in/blog/"
  status = 301
  force = true

# ── App retired (4 Nov 2026) ──────────────────────────────────────
# The pilot app is closed. Every remaining path on taru.money, including the
# old app routes (/login, /signup, /verify-email, /forgot-password,
# /reset-password, /parent/*, /child/*, /app/*), now 301s to nuberry.in.
# The page-to-page marketing redirects above still win because they come
# first. This replaces the SPA catch-all that used to serve index.html.
[[redirects]]
  from = "/app/eula"
  to = "https://nuberry.in/eula/"
  status = 301
  force = true

# www.taru.money: path-preserving 301. Only takes effect if www.taru.money
# is attached to this Netlify site as a domain alias; if it is forwarded at
# the registrar instead, fix it there (it currently answers with a 302).
[[redirects]]
  from = "https://www.taru.money/*"
  to = "https://nuberry.in/:splat"
  status = 301
  force = true

# robots.txt and the old-URL sitemap must still be served here (200), not
# redirected: Google reads taru.money's robots.txt before fetching any old
# URL, and the sitemap is how it finds the old URLs to recrawl. The files
# live in public/seo/ so these rewrites never point at their own path.
[[redirects]]
  from = "/robots.txt"
  to = "/seo/robots.txt"
  status = 200
  force = true
[[redirects]]
  from = "/sitemap.xml"
  to = "/seo/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "https://nuberry.in/"
  status = 301
  force = true

# ── Security headers ─────────────────────────────────────────────
# Minimal hardening for Phase 0. Tighten before public launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
