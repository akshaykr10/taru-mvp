  to = "https://nuberry.in/eula/"
  status = 301
  force = true
[[redirects]]
  from = "/blog/:slug"
  to = "https://nuberry.in/blog/:slug/"
  status = 301
  force = true
[[redirects]]
  from = "/blog/:slug/"
  to = "https://nuberry.in/blog/:slug/"
  status = 301
  force = true

# ── SPA redirect rule ─────────────────────────────────────────────
# All routes (/, /app, /app/*, /child/:token, /parent/*, /login, etc.)
# must fall through to index.html so React Router handles them client-side.
# Without this, a hard refresh on any sub-route returns a Netlify 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ─────────────────────────────────────────────
# Minimal hardening for Phase 0. Tighten before public launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
