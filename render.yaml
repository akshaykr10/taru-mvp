services:
  # The pilot app was retired on 4 Nov 2026. Only the waitlist API remains,
  # for nuberry.in. The taru-nav-update cron job was removed.
  # ── Backend web service ───────────────────────────────────────
  - type: web
    name: taru-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
